# Codemagic: Mac olmadan iOS uygulamasını bulutta derler, imzalar ve App Store Connect'e (TestFlight) yükler.
# Kurulum: mobil/MAGAZA.md > "Mac olmadan derleme (Codemagic)".
workflows:
  ios-app-store:
    name: Sütun Yarışı iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: KSB Games App Store Connect   # Codemagic'te eklenen API anahtarının adı
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ksbgames.sutunyarisi
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketler ve oyun dosyaları
        script: |
          cd mobil
          npm ci
          npm run sync
      - name: CocoaPods
        script: cd mobil/ios/App && pod install
      - name: İmza ayarları
        script: xcode-project use-profiles
      - name: Derleme numarası
        script: |
          cd mobil/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --workspace mobil/ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
