<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Açılış ekranı (2732x2732). Ortadaki alan her telefonda görünür, kenarlar kırpılabilir. */
  html, body { margin: 0; width: 2732px; height: 2732px; overflow: hidden; background: linear-gradient(#8fd0ff, #cfe8ff 70%); font-family: 'Segoe UI', system-ui, sans-serif; }
  .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); text-align: center; }
  img { width: 560px; height: 560px; border-radius: 120px; box-shadow: 0 24px 60px rgba(30, 60, 120, .25); }
  h1 { margin: 60px 0 0; font-size: 150px; font-weight: 900; color: #3a5bd9; letter-spacing: -2px; }
  h1 span { color: #ffb703; text-shadow: 0 8px 0 #4a3200; }
  p { margin: 30px 0 0; font-size: 64px; font-weight: 700; color: #5d6685; }
</style></head>
<body>
  <div class="box">
    <img src="icon.png" alt="">
    <h1>Sütun <span>Yarışı</span></h1>
    <p>made by KSB Games</p>
  </div>
</body></html>
